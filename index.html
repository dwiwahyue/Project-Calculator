<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Kalkulator Sederhana</h2>

    <section>
      <div class="calculator">
        <div class="display">
          <div class="display-history">0</div>
          <div class="display-input">0</div>
          <div class="temp-result">0</div>
        </div>

        <div class="all-button">
          <div class="button clear-all">CA</div>
          <div class="button delete">C</div>
          <div class="button operator">%</div>
          <div class="button operator">/</div>
          <div class="button number">7</div>
          <div class="button number">8</div>
          <div class="button number">9</div>
          <div class="button operator">X</div>
          <div class="button number">4</div>
          <div class="button number">5</div>
          <div class="button number">6</div>
          <div class="button operator">+</div>
          <div class="button number">1</div>
          <div class="button number">2</div>
          <div class="button number">3</div>
          <div class="button operator">-</div>
          <div class="button number num-0">0</div>
          <div class="button number dot">.</div>
          <div class="button equal">=</div>
        </div>
      </div>
    </section>

    <script src="main.js"></script>
  </body>
</html>
